<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>부산디지털고 2학년 · 제주 현장체험학습 탑승권</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --basalt:#161a1f; --basalt2:#20262e; --basalt3:#2b323c;
    --tangerine:#ff7a3d; --tangerine-deep:#e35f22;
    --teal:#0e8391; --gold:#e3a92b; --danger:#d1483a;
    --sand:#f6f1e6; --paper:#fffdf8;
    --ink:#20242b; --muted:#797065; --line:#e6ddc9;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Pretendard',-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--sand); color:var(--ink); overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  header{
    background:
      radial-gradient(circle at 12% -10%, #333d4a 0%, transparent 45%),
      linear-gradient(155deg,var(--basalt2),var(--basalt) 70%);
    color:#f3efe6; padding:20px 18px 16px; position:relative;
  }
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.18em; color:var(--tangerine);
    font-weight:700; display:flex; align-items:center; gap:7px; margin-bottom:8px;
  }
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--tangerine);}
  header h1{margin:0; font-size:18px; line-height:1.4; font-weight:800; letter-spacing:-.2px;}
  .pass-meta{
    display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:12px;
    font-family:var(--mono); font-size:11px; color:#c7c0b3;
  }
  .pass-meta b{color:#f3efe6; font-weight:600;}
  .pass-route{
    margin-top:14px; display:flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:15px; font-weight:700; color:#f3efe6;
  }
  .pass-route .city{letter-spacing:.03em;}
  .pass-route .plane{color:var(--tangerine); font-size:13px;}
  .pass-route .line{flex:1; height:1px; background:repeating-linear-gradient(to right,#4a5261 0 5px, transparent 5px 9px); position:relative;}

  .tear{
    height:14px; background-color:var(--basalt);
    background-image: radial-gradient(circle 7px, var(--sand) 99%, transparent 100%);
    background-size:18px 18px; background-position:-5px -9px; background-repeat:repeat-x;
  }

  nav{
    display:flex; overflow-x:auto; background:var(--basalt); padding:0 4px 6px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; position:sticky; top:0; z-index:50;
    border-bottom:1px solid #000;
  }
  nav::-webkit-scrollbar{display:none;}
  nav button{
    flex:0 0 auto; background:none; border:none; color:#8b93a3; padding:10px 12px 8px;
    font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;
    border-bottom:2.5px solid transparent; display:flex; align-items:baseline; gap:6px;
  }
  nav button .tab-no{font-family:var(--mono); font-size:10px; color:#5c6474; font-weight:700;}
  nav button.active{color:#fff; border-bottom-color:var(--tangerine);}
  nav button.active .tab-no{color:var(--tangerine);}

  main{padding:16px 14px 60px; max-width:920px; margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(5px);} to{opacity:1;transform:none;}}

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(40,30,10,.05);
  }
  .card-head{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:12px;}
  .card-head .eb{font-family:var(--mono); font-size:10px; letter-spacing:.14em; color:var(--teal); font-weight:700; margin-bottom:3px;}
  .card-head h2{margin:0; font-size:16px; font-weight:800; color:var(--ink);}
  .card-head .count{font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--sand); padding:3px 8px; border-radius:20px;}

  .search-box{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px;
    font-size:14px; margin-bottom:12px; background:var(--sand); font-family:var(--sans);
  }
  .search-box:focus{outline:none; border-color:var(--tangerine); background:#fff;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:9px 6px; text-align:left; border-bottom:1px solid var(--line); word-break:keep-all;}
  th{font-family:var(--mono); background:var(--sand); color:var(--muted); font-size:10px; letter-spacing:.06em; text-transform:uppercase;}
  .tel{font-family:var(--mono); color:var(--teal); font-weight:700; text-decoration:none; white-space:nowrap; border-bottom:1px dashed var(--teal);}
  .tel:active{opacity:.5;}
  .badge{
    display:inline-block; background:var(--basalt); color:#fff; font-size:10px;
    padding:2px 7px; border-radius:5px; font-weight:700; margin-left:5px; font-family:var(--mono);
  }
  .crown{margin-right:2px;}

  .room-card{
    position:relative; border:1.5px dashed #d8cba3; border-radius:10px; padding:12px 14px 12px 20px;
    margin-bottom:12px; background:linear-gradient(180deg,#fffefb,var(--sand));
  }
  .room-card::before{
    content:""; position:absolute; left:9px; top:14px; width:9px; height:9px; border-radius:50%;
    background:var(--paper); border:1.5px dashed #d8cba3;
  }
  .room-card .room-title{font-weight:800; color:var(--ink); font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:8px; font-family:var(--mono);}
  .room-card .room-title .rtype{font-family:var(--sans); font-weight:600; font-size:11.5px; color:var(--muted);}
  .room-card .members{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px; transition:.15s;}
  .chip.leader{border-color:var(--gold); background:#fff6de; font-weight:700;}
  .chip.match{outline:2px solid var(--tangerine); background:#fff0e6;}

  .tag{display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700; padding:3px 9px; border-radius:5px; letter-spacing:.03em;}
  .tag.day1{background:#e2f1f7;color:#0b6478;}
  .tag.day2{background:#e7f5ea;color:#1a7a3e;}
  .tag.day3{background:#fdece0;color:#c25315;}

  .board{background:var(--basalt); border-radius:14px; padding:16px 16px 8px; margin-bottom:14px; color:#e9e5da;}
  .board .day-label{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .sched-row{display:flex; gap:12px; padding:9px 0; border-bottom:1px dashed #3a4150; font-size:13px;}
  .sched-row:last-child{border-bottom:none;}
  .sched-time{flex:0 0 62px; font-family:var(--mono); color:var(--tangerine); font-size:12.5px; font-weight:700; padding-top:1px;}
  .sched-content{flex:1; color:#d8d3c6;}
  .meal .sched-content{color:#ffd9b0;}
  .meal .sched-content::after{content:" 🍴"; font-size:11px;}

  .note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.7; border-top:1px dashed var(--line); padding-top:8px;}
  .callout{
    border-left:3px solid var(--tangerine); background:#fff6ee; padding:10px 12px; border-radius:0 8px 8px 0;
    font-size:11.5px; color:#8a4a1c; line-height:1.7; margin-top:10px;
  }
  .callout.warn{border-left-color:var(--danger); background:#fdeeec; color:#8a2c22;}

  .floor{border:1px solid var(--line); border-radius:12px; margin-bottom:12px; overflow:hidden; background:var(--paper);}
  .floor-head{background:var(--basalt); color:#fff; font-family:var(--mono); font-weight:700; font-size:12.5px; padding:8px 14px; letter-spacing:.05em;}
  .floor-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:6px; padding:12px;}
  .room-num{background:var(--sand); border-radius:6px; text-align:center; padding:7px 2px; font-size:11px; font-weight:700; color:var(--muted); font-family:var(--mono); cursor:pointer; user-select:none; transition:.12s;}
  .room-num:active{transform:scale(.92);}
  .room-num.assigned{background:var(--tangerine); border:none; color:#fff;}
  .room-num.teacher{background:var(--basalt); border:none; color:#fff;}
  .room-num.selected{outline:2.5px solid var(--basalt); outline-offset:1px;}

  .room-info{
    border:1.5px dashed var(--tangerine); background:#fff8f0; border-radius:10px; padding:12px 14px;
    margin-bottom:14px; font-size:12.5px; color:var(--ink);
  }
  .room-info.empty{color:var(--muted); text-align:center; border-style:dashed; border-color:var(--line); background:var(--sand);}
  .room-info-title{font-family:var(--mono); font-weight:800; font-size:14px; margin-bottom:8px;}
  .room-info-empty{color:var(--muted); font-size:12px;}
  .room-info .members{display:flex; flex-wrap:wrap; gap:6px;}
  .room-info .chip{background:#fff; border:1px solid var(--line); border-radius:8px; padding:5px 10px; font-size:12.5px;}
  .room-info .teacher-chip{background:var(--basalt); border-color:var(--basalt); color:#fff; font-weight:700;}

  .day-picker{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto;}
  .day-pill{
    flex:1; min-width:110px; padding:10px 6px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); font-family:var(--mono); font-size:11.5px; font-weight:700; color:var(--muted);
    cursor:pointer; text-align:center; white-space:nowrap;
  }
  .day-pill.day1.active{background:#e2f1f7; border-color:#0b6478; color:#0b6478;}
  .day-pill.day2.active{background:#e7f5ea; border-color:#1a7a3e; color:#1a7a3e;}
  .day-pill.day3.active{background:#fdece0; border-color:#c25315; color:#c25315;}

  .class-picker{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto;}
  .class-pill{
    flex:0 0 auto; min-width:64px; padding:10px 16px; border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); font-family:var(--mono); font-size:12.5px; font-weight:700; color:var(--muted);
    cursor:pointer; text-align:center; white-space:nowrap;
  }
  .class-pill.active{background:var(--basalt); border-color:var(--basalt); color:#fff;}

  .safe-picker{display:flex; gap:8px; margin-bottom:12px; overflow-x:auto; flex-wrap:wrap;}
  .safe-pill{
    flex:0 0 auto; padding:9px 13px; border-radius:20px; border:1.5px solid var(--line);
    background:var(--paper); font-size:12.5px; font-weight:700; color:var(--muted);
    cursor:pointer; white-space:nowrap;
  }
  .safe-pill.active{background:var(--basalt); border-color:var(--basalt); color:#fff;}
  .safe-list{font-size:13px; line-height:2; margin:0; padding:0 0 0 20px;}
  .safe-list li{margin-bottom:2px;}

  .grid2{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:560px){.grid2{grid-template-columns:1fr 1fr;}}
  .grid3{display:grid; grid-template-columns:1fr; gap:12px;}
  @media(min-width:700px){.grid3{grid-template-columns:1fr 1fr 1fr;}}

  .flow{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:12px; margin:10px 0; font-family:var(--mono);}
  .flow .step{background:var(--sand); padding:7px 11px; border-radius:8px; font-weight:700; color:var(--ink); border:1px solid var(--line);}
  .flow .arrow{color:var(--muted);}

  .shift{display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .shift .box{flex:1; min-width:140px; border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--sand);}
  .shift .box b{display:block; color:var(--ink); font-size:12px; margin-bottom:6px; font-family:var(--mono);}

  .vendor-row{padding:10px 0; border-bottom:1px dashed var(--line);}
  .vendor-row:last-child{border-bottom:none;}
  .vendor-row .vname{font-weight:700; font-size:13.5px;}
  .vendor-row .vinfo{font-size:11.5px; color:var(--muted); margin-top:3px;}

  .site-card{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:14px; background:var(--paper);}
  .site-card .site-title{background:var(--basalt); color:#fff; font-weight:800; font-size:13.5px; padding:9px 14px;}
  .site-card .site-body{padding:12px 14px; font-size:12.5px; line-height:1.75; color:#3a3530;}
  .site-apps{display:flex; flex-wrap:wrap; gap:8px; padding:0 14px 14px;}
  .app-link{
    display:inline-block; background:var(--teal); color:#fff; text-decoration:none;
    font-size:11.5px; font-weight:700; padding:8px 12px; border-radius:8px;
  }
  .app-link:active{opacity:.8;}
  .site-notice{margin:0 14px 14px; padding:12px; border-radius:10px; background:#fff6ee; border-left:3px solid var(--tangerine);}
  .site-notice-title{font-size:11.5px; font-weight:800; color:#8a4a1c; margin-bottom:6px;}
  .site-notice .safe-list{margin:0; padding-left:18px; line-height:1.8; color:#5a3d24;}


  .bus-card{border:1.5px solid var(--line); border-radius:12px; padding:14px; background:linear-gradient(180deg,#fffefb,var(--sand));}
  .bus-card .btitle{font-family:var(--mono); font-weight:800; font-size:15px; color:var(--ink); display:flex; align-items:center; justify-content:space-between;}
  .bus-card .bmeta{font-family:var(--mono); font-size:10.5px; color:var(--muted); margin-top:2px;}
  .bus-card .bcap{font-size:11.5px; color:var(--muted); margin:8px 0 4px;}
  .bus-card .bassign{font-weight:700; font-size:13px;}
  .bus-clickable{cursor:pointer; transition:.15s;}
  .bus-clickable:active{transform:scale(.98);}
  .bus-clickable.selected{outline:2.5px solid var(--basalt); outline-offset:1px;}
  .bus-tap-hint{margin-top:8px; font-size:10.5px; font-family:var(--mono); color:var(--tangerine); font-weight:700;}
  .bus-roster{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
  .bus-roster-class{font-family:var(--mono); font-weight:800; font-size:12px; color:var(--ink); margin:8px 0 6px;}
  .bus-roster-class:first-child{margin-top:0;}

  h3.sec{font-size:12.5px; font-family:var(--mono); color:var(--ink); letter-spacing:.02em; margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line);}
  h3.sec:first-child{margin-top:0;}

  /* 🍊 이스터에그 */
  .tangerine-egg{
    position:fixed; right:12px; top:52px; font-size:20px; opacity:.3; cursor:pointer;
    z-index:200; user-select:none; transition:transform .25s ease, opacity .25s ease;
    filter:grayscale(.4);
  }
  .tangerine-egg:hover{opacity:1; transform:scale(1.25) rotate(-8deg); filter:none;}
  .tangerine-egg:active{transform:scale(.9) rotate(8deg);}
  .egg-overlay{
    position:fixed; inset:0; background:rgba(20,16,10,.55); z-index:300;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .egg-overlay.show{display:flex;}
  .egg-card{
    background:var(--paper); border-radius:16px; max-width:320px; width:100%;
    padding:22px 20px; text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.3);
    animation:eggPop .35s ease;
  }
  @keyframes eggPop{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .egg-card .egg-emoji{font-size:40px; margin-bottom:6px;}
  .egg-card h3{margin:0 0 8px; font-size:15px; color:var(--ink);}
  .egg-card p{margin:0 0 4px; font-size:12.5px; color:var(--muted); line-height:1.7;}
  .egg-card .egg-stamp{
    font-family:var(--mono); font-size:11px; color:var(--teal); margin-top:10px;
    border-top:1px dashed var(--line); padding-top:10px;
  }
  .egg-card button{
    margin-top:14px; background:var(--basalt); color:#fff; border:none; border-radius:8px;
    padding:9px 18px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:var(--sans);
  }
</style>
</head>

<nav id="tabbar"></nav>
<main id="main"></main>

function searchAllClasses(q){
  let matches = [];
  Object.keys(studentsByClass).forEach(cls=>{
    studentsByClass[cls].forEach(s=>{
      if(s.name.includes(q)) matches.push(Object.assign({cls}, s));
    });
  });
  if(matches.length===0){
    return `<p class="note">"${q}"와(과) 일치하는 학생이 없습니다.</p>`;
  }
  let rows = matches.map(s=>`
    <tr>
      <td><span class="badge" style="background:var(--teal);">${s.cls}</span></td>
      <td>${s.name}${s.role?`<span class="badge">${s.role}</span>`:""}</td>
      <td>${telLink(s.stu)}</td>
      <td>${telLink(s.dad)}</td>
      <td>${telLink(s.mom)}</td>
      <td style="font-family:var(--mono);font-size:11px;color:var(--muted);">${s.bd}</td>
    </tr>`).join('');
  return `<div style="overflow-x:auto;"><table>
    <thead><tr><th>반</th><th>이름</th><th>학생전화</th><th>부</th><th>모</th><th>생일</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

      html += `<div class="bus-roster">`;
      for(const cls in roster){
        html += `<div class="bus-roster-class">${cls} <span style="color:var(--muted);font-weight:400;">(${roster[cls].length}명)</span></div>
          <div class="members">${roster[cls].map(n=>`<span class="chip">${n}</span>`).join('')}</div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;
  });
  html += `</div>`;
  html += `<div class="card"><p class="note">2학년 2반은 1호차(1·2·5반)에 탑승합니다. 5반은 세 버스에 5·4·5명씩 분산 배정.</p></div>`;
  return html;
}

function renderFloorplan(){
  let html = `<div class="card"><div class="card-head"><div><div class="eb">${eb('floorplan')}</div><h2>숙소 배치도</h2></div></div>`;

  html += `<div id="roomInfoBox" class="room-info ${selectedRoom?'':'empty'}">`;
  if(selectedRoom){
    const ex = roomExamples.find(r=>r.roomNo===selectedRoom);
    const tr = teacherRooms.find(r=>r.roomNo===selectedRoom);
    html += `<div class="room-info-title">${selectedRoom}호</div>`;
    if(ex){
      html += `<div class="members">${ex.members.map(m=>`<span class="chip">${m}</span>`).join('')}</div>`;
    } else if(tr){
      html += `<div class="members"><span class="chip teacher-chip">🧑‍🏫 ${tr.teacher}</span></div>`;
    } else {
      html += `<div class="room-info-empty">배정 정보 없음 (미정)</div>`;
    }
  } else {
    html += `👆 호실 번호를 눌러 배정 인원을 확인하세요.`;
  }
  html += `</div>`;

  floors.forEach(f=>{
    html += `<div class="floor"><div class="floor-head">${f.name}</div><div class="floor-grid">`;
    f.rooms.forEach(rm=>{
      const assigned = f.assigned && f.assigned.includes(rm);
      const isTeacher = teacherRooms.some(r=>r.roomNo===rm);
      const sel = selectedRoom===rm;
      html += `<div class="room-num ${assigned?'assigned':''} ${isTeacher?'teacher':''} ${sel?'selected':''}" onclick="selectRoom('${rm}')">${rm}</div>`;
    });
    html += `</div></div>`;
  });
  html += `<p class="note">주황색 = 학생 배정 호실, 남색 = 교사 배정 호실. 각 층 프론트 인근에 소화기·비상통로가 표시된 피난 안내도가 게시되어 있습니다.</p></div>`;
  return html;
}

const renderers = {
  students: renderStudents, contacts: renderContacts, schedule: renderSchedule,
  vendors: renderVendors, bus: renderBus, rooms: renderRooms,
  floorplan: renderFloorplan, night: renderNight, safetyEdu: renderSafetyEdu
};

let activeTab = 'students';

function showTab(id){
  activeTab = id;
  [...tabbar.children].forEach(b=> b.classList.toggle('active', b.dataset.id===id));
  main.innerHTML = `<div class="panel active">${renderers[id]()}</div>`;
  attachSearch(id);
  window.scrollTo({top:0,behavior:'instant'});
}

function rerenderPanel(){
  main.innerHTML = `<div class="panel active">${renderers[activeTab]()}</div>`;
  attachSearch(activeTab);
}

function selectDay(i){
  currentDay = i;
  rerenderPanel();
}

function selectClass(cls){
  currentClass = cls;
  rerenderPanel();
}

function selectSafetyEdu(k){
  currentSafetyEdu = k;
  rerenderPanel();
}

function selectRoom(roomNo){
  selectedRoom = (selectedRoom===roomNo) ? null : roomNo;
  rerenderPanel();
}

function selectBus(busNo){
  selectedBus = (selectedBus===busNo) ? null : busNo;
  rerenderPanel();
}

function attachSearch(id){
  if(id==='students'){
    const input = document.getElementById('stuSearch');
    const resultsBox = document.getElementById('searchResults');
    const classView = document.getElementById('classView');
    input.addEventListener('input', ()=>{
      const q = input.value.trim();
      if(q===''){
        resultsBox.style.display = 'none';
        classView.style.display = '';
      } else {
        classView.style.display = 'none';
        resultsBox.style.display = '';
        resultsBox.innerHTML = searchAllClasses(q);
      }
    });
  }
  if(id==='rooms'){
    const input = document.getElementById('roomSearch');
    if(!input) return;
    input.addEventListener('input', ()=>{
      const q = input.value.trim();
      document.querySelectorAll('.room-item').forEach(item=>{
        const members = item.dataset.members.split(',');
        item.style.display = (q==='' || members.some(m=>m.includes(q))) ? '' : 'none';
        item.querySelectorAll('.mem-chip').forEach(chip=>{
          chip.classList.toggle('match', q!=='' && chip.dataset.name.includes(q));
        });
      });
    });
  }
}

showTab('students');
